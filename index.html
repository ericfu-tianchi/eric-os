<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tianchi OS" />
    <meta name="description" content="Tianchi OS — the personal operating system of Tianchi (Eric) Fu. Product manager, designer, builder." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tianchi OS</title>
    <script>
      // Analytics: put the phone experience at /phone before Cloudflare's beacon records the first page view
      // (same rule as useIsMobile in src/App.tsx: the desktop needs a 27 × 13 grid of ~44px cells under the menubar).
      (function () {
        var q = location.search, p = location.pathname;
        // Tianchi's own visits: open the site once with ?me (or always, in incognito) and they're filed under /me/…
        var me = false;
        try { if (/[?&]me=0\b/.test(q)) localStorage.removeItem("eric-os-me"); else if (/[?&]me\b/.test(q)) localStorage.setItem("eric-os-me", "1"); me = !!localStorage.getItem("eric-os-me"); } catch (e) {}
        if (/[?&]me\b/.test(q) && !/[?&]me=0\b/.test(q)) me = true;
        if (p.indexOf("/me/") === 0) p = p.slice(3);
        if (p !== "/" && p !== "/phone") return;
        var phone = /[?&]ios\b/.test(q) ? true : /forceDesktop|[?&]desktop\b/.test(q) ? false : (function () {
          var h = innerHeight - 34, rows = Math.max(8, Math.round(h / 44)), cols = Math.max(8, Math.round(innerWidth / (h / rows)));
          return cols < 27 || rows < 13;
        })();
        var want = (me ? "/me" : "") + (phone ? "/phone" : "/");
        if (location.pathname !== want) history.replaceState(null, "", want + q + location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
