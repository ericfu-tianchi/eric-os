<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERIC OS · 1200 × 640 desktop preview</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #111216; color: #ededf0; }
      header { padding: 16px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.09); background: #1c1d21; }
      .eyebrow { margin: 0 0 5px; color: #93959e; font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
      h1 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
      .copy { margin: 7px 0 0; color: #b5b6bc; font-size: 12px; line-height: 1.45; }
      .viewport { padding: 22px 18px 34px; overflow-x: hidden; }
      .stage { position: relative; width: 100%; min-height: 280px; }
      .scale-shell { position: absolute; top: 0; left: 0; transform-origin: top left; }
      .desktop-frame { width: 1200px; height: 640px; overflow: hidden; border: 2px solid #f5b027; border-radius: 5px; background: #1c1d21; box-shadow: 0 16px 48px rgba(0,0,0,.52); }
      iframe { display: block; width: 1200px; height: 640px; border: 0; }
      .legend { width: min(100%, 600px); margin: 18px auto 0; color: #a6a8b0; font-size: 12px; line-height: 1.6; }
      .legend b { color: #f5b027; }
      code { color: #e8e8eb; font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">ERIC OS · RESPONSIVE CHECK</p>
      <h1>这是完整的 1200 × 640 最小桌面。</h1>
      <p class="copy">黄色细边框内才是实际网站画布；它被等比例缩小，仅为了让你在右侧面板一次看完整。</p>
    </header>
    <main class="viewport">
      <div class="stage" id="stage">
        <div class="scale-shell" id="shell">
          <div class="desktop-frame"><iframe title="ERIC OS at 1200 by 640" src="/?forceDesktop=1&tut=1"></iframe></div>
        </div>
      </div>
      <p class="legend"><b>怎么体验：</b>先看黄色框内 `hello` 是否完整；然后直接在框内双击 <code>SNAKE.SYS</code>。框内页面会以真正的 1200 × 640 运行，按方向键也能游玩。</p>
    </main>
    <script>
      const width = 1200, height = 640;
      const stage = document.getElementById('stage');
      const shell = document.getElementById('shell');
      function fit() {
        const availableWidth = Math.max(260, stage.clientWidth);
        const availableHeight = Math.max(240, window.innerHeight - 190);
        const scale = Math.min(1, availableWidth / width, availableHeight / height);
        const offset = Math.max(0, (availableWidth - width * scale) / 2);
        shell.style.transform = `translateX(${offset}px) scale(${scale})`;
        stage.style.height = `${height * scale}px`;
      }
      addEventListener('resize', fit);
      fit();
    </script>
  </body>
</html>
