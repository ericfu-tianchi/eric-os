<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soul Blade icon</title>
<style>
@font-face{font-family:Geist;src:url(/src/assets/fonts/geist-sans-variable.woff2);font-weight:100 900}
body{margin:0;background:#111214;color:#e8e8ea;font:14px/1.5 Geist,system-ui}
main{max-width:1180px;margin:0 auto;padding:36px 20px 80px}
h1{font-size:22px;margin:0 0 4px}p.lead{color:#9a9ba1;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{background:#1c1d21;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.card h2{margin:0;padding:12px 16px 0;font-size:15px}.card small{display:block;padding:0 16px 10px;color:#8b8d93}
.big{display:grid;place-items:center;height:200px;background:#141518}
.big img{width:170px;height:170px;object-fit:contain;image-rendering:pixelated}
.desk{position:relative;height:118px;background:#1c1d21;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;display:flex;justify-content:center;gap:34px;padding-top:16px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px}
.ic img{width:48px;height:48px;object-fit:contain}
.ic span{font:600 11px Geist;color:#fff;text-shadow:0 1px 2px #000;text-align:center}
.phone{display:flex;gap:16px;justify-content:center;align-items:flex-end;padding:16px;background:#26272c}
.tile{width:62px;height:62px;border-radius:14px;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
.tile img{width:100%;height:100%;object-fit:cover}.tile.g img{width:80%;height:80%;object-fit:contain}
.lbl{font:500 11px system-ui;color:#fff;text-align:center;margin-top:5px}
.cur{outline:2px dashed #555}
</style></head><body><main>
<h1>Soul Blade · icon options (round 4: a cleaner slash)</h1>
<p class="lead">Each card: large, on the desktop at real size next to My Lego World and Snake, and as a phone app icon. Current icon first for reference.</p>
<div class="grid" id="g"></div>
</main>
<script>
const O=[["f1-behind-c.png","A · previous (for reference)","the slash you liked, but too long and busy","g",""],
["g1-thin-c.png","A1 · One thin flick","a single tapered stroke, barely past the sun, a few flecks","g",""],
["g2-inside-c.png","A2 · Cut inside the sun","the strike stays within the disc: the neatest outline","g",""],
["g3-double-c.png","A3 · Double cut","two thin parallel lines, graphic, no flecks","g",""],
["g0-noslash-c.png","A0 · No slash","just the ronin on the sun","g",""]];
document.getElementById("g").innerHTML=O.map(([f,t,s,k,bg])=>`<div class="card"><h2>${t}</h2><small>${s}</small>
<div class="big"><img src="${f}"></div>
<div class="desk"><div class="ic"><img src="${f}"><span>Soul Blade</span></div><div class="ic"><img src="lego-world.svg"><span>My Lego World</span></div><div class="ic"><img src="snake.png"><span>Snake</span></div></div>
<div class="phone"><div><div class="tile ${k}" style="background:${k==="g"?"transparent":bg};box-shadow:none"><img src="${f}"></div><div class="lbl">Soul Blade</div></div><div><div class="tile g" style="background:linear-gradient(180deg,#ffd84a,#f3ae00)"><img src="lego-world.svg"></div><div class="lbl">Lego World</div></div></div></div>`).join("");
</script></body></html>
