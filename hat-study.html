<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake Wardrobe</title>
<style>
  @font-face { font-family: "Geist"; src: url("/src/assets/fonts/geist-sans-variable.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --stage: #1c1d21; --card: #24252b; --line: rgba(255,255,255,.08); --ink: #ececef; --muted: #8a8b92;
    --pick: #0a64e0; --green: #06C268;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: "Geist", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 120px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
  .lede { color: var(--muted); margin: 0 0 8px; font-size: 15px; line-height: 1.6; max-width: 70ch; }
  section { margin-top: 44px; }
  section h2 { font-size: 20px; margin: 0; font-weight: 700; }
  section .brief { color: var(--muted); font-size: 13.5px; margin: 4px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; cursor: pointer; transition: border-color .12s, transform .12s; text-align: left; color: inherit; font: inherit;
  }
  .card:hover { border-color: rgba(255,255,255,.22); }
  .card.on { border-color: var(--pick); box-shadow: 0 0 0 1px var(--pick); }
  .card .id { position: absolute; top: 12px; left: 14px; font: 600 11px ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: .04em; }
  .card .tick { position: absolute; top: 10px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); display: grid; place-items: center; font-size: 13px; }
  .card.on .tick { background: var(--pick); border-color: var(--pick); }
  .card.on .tick::after { content: "✓"; color: #fff; }
  .zoom { display: flex; justify-content: center; padding: 8px 0 2px; }
  .real { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 6px 0 10px; border-top: 1px dashed var(--line); margin-top: 6px; }
  .real span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .card b { display: block; font-size: 14.5px; }
  .card p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    background: #f4f4f6; color: #17171a; padding: 9px 9px 9px 16px; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
    font-size: 13px; max-width: calc(100vw - 32px);
  }
  .bar code { font: 600 12.5px ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
  .bar button { border: 0; border-radius: 8px; background: #17171a; color: #fff; font: 600 12.5px inherit; padding: 8px 12px; cursor: pointer; font-family: inherit; }
  h2 .tag { font: 600 10.5px ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .08em; padding: 3px 7px; border-radius: 4px; margin-left: 8px; vertical-align: 3px; background: rgba(255,255,255,.08); color: var(--muted); }
  h2 .tag.round3 { background: rgba(10,100,224,.22); color: #8db8ff; }
  h2 .tag.round2 { background: rgba(10,100,224,.22); color: #8db8ff; }
  h2 .tag.locked { background: rgba(6,194,104,.18); color: #5fe09a; }
  .bubble-real { width: 60px; height: 52px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2), 0 16px 40px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Snake Wardrobe</h1>
  <p class="lede">Each card shows the piece at 3× on top and at real desktop size underneath (facing right, and turned upward the way it looks mid-game). Click to pick, one or more per group; the bar at the bottom collects your picks so you can copy them back to me.</p>
  <div id="root"></div>
</div>
<div class="bar"><span>Picks</span><code id="picks">none yet</code><button id="copy">Copy</button></div>

<script type="module">
  import { HAT_GROUPS, CHAT_GLYPHS, hatSvg } from "/src/components/snakeHats.ts";

  const GREEN = "#06C268", TONGUE = "#F04E38";
  const TONGUE_D = "M0 -1.4 C10 -2.2 15 -5 23 -12.5 C18 -5.5 14 -2.6 8 -0.6 C15 1.2 20 4.5 27 10 C18 4.8 11 2.2 0 1.6 Z";

  // One head, exactly like the desktop snake: 44px cell, 1px gap, eyes looking ahead.
  function head(hat, angle = 0) {
    const er = 5.5, pr = er * 0.42;
    const eyes = [-1, 1].map((s) => `<circle cx="13.75" cy="${s * 9.24}" r="${er}" fill="#fafafa"/><circle cx="${13.75 + pr * 0.8}" cy="${s * 9.24}" r="${pr}" fill="#363636"/>`).join("");
    const body = `<g transform="rotate(${angle})">
        <g transform="translate(23 0)"><path d="${TONGUE_D}" fill="${TONGUE}"/></g>
        <rect x="-21" y="-21" width="42" height="42" rx="4.4" fill="${GREEN}"/>${eyes}
        ${hat}</g>`;
    return body;
  }
  const cells = (angle, n) => {
    // body cells trailing behind the head
    const v = angle === 0 ? [-44, 0] : [0, 44];
    return Array.from({ length: n }, (_, i) => i + 1).map((k) => `<rect x="${v[0] * k - 21}" y="${v[1] * k - 21}" width="42" height="42" rx="4.4" fill="${GREEN}"/>`).join("");
  };

  const PICK_KEY = "snake-wardrobe-picks";
  let picks = new Set();
  try { picks = new Set(JSON.parse(localStorage.getItem(PICK_KEY) || "[]")); } catch {}
  const sync = () => {
    document.getElementById("picks").textContent = picks.size ? [...picks].join(", ") : "none yet";
    try { localStorage.setItem(PICK_KEY, JSON.stringify([...picks])); } catch {}
  };

  function card(id, label, note, zoomSvg, realHtml) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "card" + (picks.has(id) ? " on" : "");
    el.innerHTML = `<span class="id">${id.toUpperCase()}</span><span class="tick"></span>
      <div class="zoom">${zoomSvg}</div><div class="real">${realHtml}</div><b>${label}</b><p>${note ?? ""}</p>`;
    el.onclick = () => { picks.has(id) ? picks.delete(id) : picks.add(id); el.classList.toggle("on"); sync(); };
    return el;
  }

  const root = document.getElementById("root");
  const section = (title, brief, tag) => {
    const s = document.createElement("section");
    s.innerHTML = `<h2>${title}${tag ? ` <em class="tag ${tag.replace(/\s/g, "")}">${tag}</em>` : ""}</h2><p class="brief">${brief}</p><div class="grid"></div>`;
    root.appendChild(s);
    return s.querySelector(".grid");
  };

  for (const grp of HAT_GROUPS) {
    const g = section(grp.title, grp.brief, grp.tag);
    for (const d of grp.designs) {
      const zoom = `<svg width="240" height="198" viewBox="-38 -36 88 72">${head(hatSvg(d, 0), 0)}</svg>`;
      const right = `<svg width="152" height="76" viewBox="-112 -38 152 76">${cells(0, 2)}${head(hatSvg(d, 0), 0)}</svg>`;
      const up = `<svg width="76" height="112" viewBox="-38 -46 76 112">${cells(-90, 1)}${head(hatSvg(d, -90), -90)}</svg>`;
      g.appendChild(card(d.id, d.label, d.note, zoom, right + up));
    }
  }

  // Ask · chat glyphs: in the thought bubble, 3× and real size
  const g0 = section("Ask about Eric · chat icon", "Replaces the “?” inside the thought bubble — no pick yet", "kept");
  for (const c of CHAT_GLYPHS) {
    const zoom = `<svg width="210" height="182" viewBox="-14 -10 60 52"><ellipse cx="16" cy="16" rx="30" ry="26" fill="#fff"/><g>${c.svg}</g></svg>`;
    const real = `<div class="bubble-real"><svg width="32" height="32" viewBox="0 0 32 32">${c.svg}</svg></div><span>real size</span>`;
    g0.appendChild(card(c.id, c.label, c.note, zoom, real));
  }

  sync();
  document.getElementById("copy").onclick = async (e) => {
    try { await navigator.clipboard.writeText([...picks].join(", ")); e.target.textContent = "Copied"; setTimeout(() => (e.target.textContent = "Copy"), 1200); } catch {}
  };
</script>
</body>
</html>
