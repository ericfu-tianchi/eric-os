<meta charset="utf-8" />
<title>Tianchi OS — 尺寸已统一 · 挑蛇</title>
<style>
  :root{--paper:#131317;--panel:#1d1e23;--ink:#ececf0;--muted:#8b8d95;--line:rgba(255,255,255,.09);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;padding:36px 40px 80px;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.6;max-width:900px;margin:0 0 22px;}
  h2{font-size:15px;font-weight:800;margin:26px 0 10px;}
  h2 .zh{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;}
  .card img{max-width:100%;height:auto;border-radius:6px;display:block;}
  .imgwrap{overflow-x:auto;}
  .ok{color:#c9e8b4;background:#26301f;border:1px solid #3c5a2e;border-radius:7px;padding:3px 9px;font-size:12px;font-family:ui-monospace,monospace;}
  .note{color:#6f717a;font-size:11.5px;font-family:ui-monospace,monospace;margin-top:8px;}
</style>
<body>
  <h1>Tianchi OS — 尺寸已统一 · 现在挑 Snake</h1>
  <p class="sub"><span class="ok">✓ 尺寸 bug 已修</span> 每个图标现在统一放到同一画布、同比缩放,桌面/Dock 上大小一致(不再文件夹偏小)。<span class="ok">✓ 苹果 1 已定</span>(等会儿接进 Snake 游戏当果实)。下面是重生成的 3 条盘蛇——风格/描边/尺寸都对齐了套 1。<b>挑一条告诉我编号。</b></p>

  <h2>桌面实况(尺寸修复后) <span class="zh">看文件夹/文档/PDF 现在一样大了</span></h2>
  <div class="card"><div class="imgwrap"><img src="./norm-desktop.png"></div></div>

  <h2>重生成的盘蛇 <span class="zh">1 / 2 / 3 从左到右 — 挑一个,与套 1 一致</span></h2>
  <div class="card"><div class="imgwrap"><img src="./snakes3.png"></div></div>

  <p class="note">告诉我 Snake 编号,我抠透明+统一尺寸装进桌面,再把苹果 1 接到 Snake 游戏当果实。这一轮就收尾了。</p>
</body>
